<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RideX Motors - AI Assistant</title>


    <style>

        /* =========================================
           BASIC RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #111111;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            width: 100%;

            background: #000000;

            color: #ffffff;

            padding: 18px 20px;

            text-align: center;
        }


        .header h1 {

            font-size: 24px;

            font-weight: 700;

            margin-bottom: 5px;
        }


        .header p {

            font-size: 14px;

            color: #dddddd;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .main {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding: 50px 20px;

            text-align: center;
        }


        .main h2 {

            font-size: 34px;

            color: #111111;

            margin-bottom: 15px;
        }


        .main p {

            max-width: 650px;

            margin: 0 auto;

            font-size: 16px;

            line-height: 1.7;

            color: #555555;
        }


        /* =========================================
           DIALOGFLOW MESSENGER
        ========================================= */

        df-messenger {

            /*
             -----------------------------------------
             CHAT WINDOW
             -----------------------------------------
            */

            --df-messenger-chat-background-color: #ffffff;


            /*
             -----------------------------------------
             HEADER
             -----------------------------------------
            */

            --df-messenger-button-titlebar-color: #000000;

            --df-messenger-button-titlebar-font-color: #ffffff;


            /*
             -----------------------------------------
             CUSTOMER MESSAGE
             -----------------------------------------
            */

            --df-messenger-user-message: #000000;


            /*
             -----------------------------------------
             BOT MESSAGE
             -----------------------------------------
            */

            --df-messenger-bot-message: #f1f1f1;


            /*
             -----------------------------------------
             TEXT
             -----------------------------------------
            */

            --df-messenger-font-color: #ffffff;


            /*
             -----------------------------------------
             INPUT BOX
             -----------------------------------------
            */

            --df-messenger-input-box-color: #ffffff;

            --df-messenger-input-font-color: #111111;

            --df-messenger-input-placeholder-font-color: #777777;


            /*
             -----------------------------------------
             SEND BUTTON
             -----------------------------------------
            */

            --df-messenger-send-icon: #000000;


            /*
             -----------------------------------------
             Z-INDEX
             -----------------------------------------
            */

            z-index: 99999;
        }


        /* =========================================
           DESKTOP CHAT SIZE
        ========================================= */

        @media (min-width: 769px) {

            df-messenger {

                --df-messenger-chat-window-width: 400px;

                --df-messenger-chat-window-height: 600px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            .header {

                padding: 15px 12px;
            }


            .header h1 {

                font-size: 20px;
            }


            .header p {

                font-size: 12px;
            }


            .main {

                padding: 35px 15px;
            }


            .main h2 {

                font-size: 26px;

                margin-bottom: 12px;
            }


            .main p {

                font-size: 14px;

                line-height: 1.6;
            }


            /* ==============================
               MOBILE DIALOGFLOW
            ============================== */

            df-messenger {

                /*
                 Chat window
                */

                --df-messenger-chat-window-width: 100vw;

                --df-messenger-chat-window-height: calc(100vh - 65px);


                /*
                 Chat background
                */

                --df-messenger-chat-background-color: #ffffff;


                /*
                 Header
                */

                --df-messenger-button-titlebar-color: #000000;

                --df-messenger-button-titlebar-font-color: #ffffff;


                /*
                 Customer
                */

                --df-messenger-user-message: #000000;


                /*
                 Bot
                */

                --df-messenger-bot-message: #f1f1f1;


                /*
                 Text
                */

                --df-messenger-font-color: #ffffff;


                /*
                 Input
                */

                --df-messenger-input-box-color: #ffffff;

                --df-messenger-input-font-color: #111111;

                --df-messenger-input-placeholder-font-color: #777777;


                /*
                 Send
                */

                --df-messenger-send-icon: #000000;
            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .header h1 {

                font-size: 19px;
            }


            .header p {

                font-size: 11px;
            }


            .main {

                padding: 30px 12px;
            }


            .main h2 {

                font-size: 23px;
            }


            .main p {

                font-size: 13px;
            }

        }

    </style>


    <!-- =========================================
         DIALOGFLOW MESSENGER SCRIPT
    ========================================= -->

    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1">
    </script>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="header">

        <h1>
            RideX Motors
        </h1>

        <p>
            Your AI Vehicle Assistant
        </p>

    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <main class="main">

        <h2>
            Welcome to RideX Motors
        </h2>


        <p>
            Find your ideal vehicle, check vehicle details,
            explore available cars and get assistance from
            our AI chatbot.
        </p>

    </main>



    <!-- =========================================
         DIALOGFLOW CHATBOT
    ========================================= -->

    <df-messenger

        intent="WELCOME"

        chat-title="RideX_Motors"

        agent-id="ab8e373c-8bdb-4dd9-b8d1-4b8e5c50da1b"

        language-code="en">

    </df-messenger>


</body>

</html>
